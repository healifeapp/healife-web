    <!-- Cihaza göre doğru mağazaya yönlendirme (B-14). UTM parametreleri
         Google Play'e referrer olarak taşınır. Masaüstü ve JS kapalı
         durumda aşağıdaki iki rozet görünür. -->
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var ios =
          /iPhone|iPad|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var android = /Android/.test(ua);
        if (!ios && !android) return;
        var utm = [];
        try {
          new URLSearchParams(location.search).forEach(function (v, k) {
            if (/^utm_/i.test(k)) utm.push(k + "=" + v);
          });
        } catch (e) {}
        var url = ios
          ? "https://apps.apple.com/app/id6761519395"
          : "https://play.google.com/store/apps/details?id=com.dcp.humanos" +
            (utm.length ? "&referrer=" + encodeURIComponent(utm.join("&")) : "");
        location.replace(url);
      })();
    </script>
