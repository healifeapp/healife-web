<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yönetim — Healife</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="/assets/brand/icon.png?v=20260830b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" />
    <link rel="stylesheet" href="/styles/tokens.css?v=20260917a" />
    <link rel="stylesheet" href="/styles/base.css?v=20261102a" />
    <style>
      .adm { min-height: 100svh; padding: clamp(2rem, 6vw, 4rem) var(--gutter); }
      .adm__inner { max-width: 560px; margin: 0 auto; }
      .adm__inner.is-wide { max-width: 860px; }
      .adm__tabs { display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
      .adm__tab { padding: 0.55rem 1.1rem; border-radius: var(--r-pill); border: 1px solid var(--hairline-strong); background: transparent; color: var(--text-2); font: inherit; font-weight: 600; cursor: pointer; }
      .adm__tab.is-active { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }
      .adm select { padding: 0.8rem 1rem; border-radius: var(--r-pill); border: 1px solid var(--hairline-strong); background: transparent; color: inherit; font: inherit; }
      .adm select option { color: #111; }
      .adm__row { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; color: var(--text-2); font-size: 0.875rem; }
      .adm__row strong { color: var(--text-1, inherit); font-weight: 600; }
      .adm__badge.is-warn { border-color: #f5b301; color: #f5b301; }
      .adm__badge.is-off { border-color: #ff6b6b; color: #ff6b6b; }
      .adm h1 { margin-top: 1.5rem; font-size: var(--fs-h3); font-weight: 700; }
      .adm__hint { margin-top: 0.5rem; color: var(--text-2); font-size: 0.9375rem; }
      .adm form { display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
      .adm input { flex: 1 1 240px; min-width: 0; padding: 0.8rem 1rem; border-radius: var(--r-pill); border: 1px solid var(--hairline-strong); background: transparent; color: var(--text); font: inherit; }
      .adm input:focus { outline: none; border-color: var(--lime); }
      .adm__btn { padding: 0.8rem 1.4rem; border-radius: var(--r-pill); border: 1px solid var(--hairline-strong); background: transparent; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
      .adm__btn:hover { border-color: var(--lime); color: var(--lime); }
      .adm__btn.is-primary { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }
      .adm__btn.is-primary:hover { background: var(--lime-bright); color: var(--on-lime); }
      .adm__btn:disabled { opacity: 0.5; cursor: default; }
      .adm__msg { margin-top: 1rem; min-height: 1.5em; color: var(--text-2); }
      .adm__msg.is-error { color: #ff6b6b; }
      .adm__list { margin-top: 1rem; display: grid; gap: 0.75rem; }
      .adm__card { padding: 1rem 1.25rem; border-radius: 16px; border: 1px solid var(--hairline-strong); display: grid; gap: 0.35rem; }
      .adm__email { font-weight: 600; word-break: break-all; }
      .adm__meta { color: var(--text-2); font-size: 0.875rem; }
      .adm__badge { justify-self: start; padding: 0.2rem 0.7rem; border-radius: var(--r-pill); font-size: 0.8125rem; font-weight: 600; border: 1px solid var(--hairline-strong); }
      .adm__badge.is-on { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }
      .adm__card .adm__btn { justify-self: start; margin-top: 0.5rem; }
      .adm__forget { margin-top: 2rem; background: none; border: 0; color: var(--text-2); font: inherit; text-decoration: underline; cursor: pointer; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="adm" id="main">
      <div class="adm__inner">
        <img src="/assets/brand/logo.svg?v=20260830b" alt="Healife" width="130" height="24" />
        <h1 id="title">Premium yönetimi</h1>

        <section id="keyStep">
          <p class="adm__hint">Devam etmek için yönetim anahtarını gir.</p>
          <form id="keyForm" autocomplete="off">
            <input id="keyInput" type="password" placeholder="Yönetim anahtarı" required />
            <button class="adm__btn is-primary" type="submit">Devam</button>
          </form>
        </section>

        <nav class="adm__tabs" id="tabs" hidden>
          <button class="adm__tab is-active" type="button" data-tab="premium">Premium</button>
          <button class="adm__tab" type="button" data-tab="orders">Web siparişleri</button>
        </nav>

        <section id="ordersStep" hidden>
          <p class="adm__hint">hea-life.com üzerinden PayTR ile gelen siparişler. Test siparişleri gizli.</p>
          <form id="ordersForm" autocomplete="off">
            <select id="ordersStatus" aria-label="Durum">
              <option value="paidOnly">Ödenenler</option>
              <option value="">Hepsi</option>
              <option value="pending">Bekleyen</option>
              <option value="failed">Başarısız</option>
            </select>
            <input id="ordersEmail" type="email" placeholder="E-posta (isteğe bağlı)" />
            <button class="adm__btn is-primary" type="submit">Listele</button>
          </form>
          <div class="adm__list" id="orders"></div>
        </section>

        <section id="searchStep" hidden>
          <p class="adm__hint">Kullanıcının uygulamaya kayıtlı e-postasını yaz.</p>
          <form id="searchForm" autocomplete="off">
            <input id="emailInput" type="email" placeholder="ornek@gmail.com" required />
            <button class="adm__btn is-primary" type="submit">Ara</button>
          </form>
          <div class="adm__list" id="results"></div>
          <button class="adm__forget" id="forgetKey" type="button">Anahtarı unut</button>
        </section>

        <p class="adm__msg" id="msg" role="status"></p>
      </div>
    </main>

    <script>
      (function () {
        var API = 'https://dcp-humanos-410d767c97ce.herokuapp.com/api';
        var STORE = 'healife_admin_key';
        var $ = function (id) { return document.getElementById(id); };
        var memKey = '';
        var activeTab = 'premium';

        function getKey() { if (memKey) return memKey; try { return sessionStorage.getItem(STORE) || ''; } catch (e) { return ''; } }
        function setKey(k) { memKey = k; try { sessionStorage.setItem(STORE, k); } catch (e) {} }
        function clearKey() { memKey = ''; try { sessionStorage.removeItem(STORE); } catch (e) {} }

        function say(text, isError) {
          $('msg').textContent = text || '';
          $('msg').className = 'adm__msg' + (isError ? ' is-error' : '');
        }

        function showStep() {
          var has = !!getKey();
          var orders = activeTab === 'orders';
          $('keyStep').hidden = has;
          $('tabs').hidden = !has;
          $('searchStep').hidden = !has || orders;
          $('ordersStep').hidden = !has || !orders;
          $('main').querySelector('.adm__inner').classList.toggle('is-wide', has && orders);
          $('title').textContent = orders ? 'Web siparişleri' : 'Premium yönetimi';
          (has ? (orders ? $('ordersEmail') : $('emailInput')) : $('keyInput')).focus();
        }

        function call(method, path, body) {
          return fetch(API + path, {
            method: method,
            headers: Object.assign({ 'X-Admin-Key': getKey() }, body ? { 'Content-Type': 'application/json' } : {}),
            body: body ? JSON.stringify(body) : undefined
          }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (data) {
              if (r.ok) return data.results;
              if (r.status === 401) { clearKey(); showStep(); throw new Error('Anahtar geçersiz. Lütfen tekrar gir.'); }
              if (r.status === 429) throw new Error('Çok fazla istek. Bir dakika bekleyip tekrar dene.');
              if (r.status === 503) throw new Error('Yönetim paneli sunucuda kapalı.');
              throw new Error(data.message || 'Bir hata oluştu (' + r.status + ').');
            });
          }, function () { throw new Error('Sunucuya ulaşılamadı. Bağlantını kontrol et.'); });
        }

        function isPremium(u) { return !!(u.entitlements.program || u.entitlements.pro); }

        function render(users) {
          var list = $('results');
          list.innerHTML = '';
          users.forEach(function (u) { list.appendChild(card(u)); });
        }

        function card(u) {
          var el = document.createElement('div');
          el.className = 'adm__card';
          var on = isPremium(u);
          var email = document.createElement('div');
          email.className = 'adm__email';
          email.textContent = u.email || '(e-posta yok)';
          var meta = document.createElement('div');
          meta.className = 'adm__meta';
          meta.textContent = (u.name || 'İsimsiz') + ' · kayıt: ' +
            (u.createdAt ? new Date(u.createdAt).toLocaleDateString('tr-TR') : '-');
          var badge = document.createElement('span');
          badge.className = 'adm__badge' + (on ? ' is-on' : '');
          badge.textContent = on ? 'Premium' : 'Premium değil';
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'adm__btn' + (on ? '' : ' is-primary');
          btn.textContent = on ? "Premium'u kaldır" : 'Premium ver';
          btn.addEventListener('click', function () {
            var q = on
              ? u.email + " hesabından premium kaldırılsın mı?"
              : u.email + ' hesabına premium verilsin mi?';
            if (!confirm(q)) return;
            btn.disabled = true;
            say('');
            call('POST', '/admin/users/' + u._id + '/premium', { grant: !on })
              .then(function (updated) {
                el.replaceWith(card(updated));
                say(isPremium(updated) ? 'Premium verildi.' : 'Premium kaldırıldı.');
              })
              .catch(function (e) { btn.disabled = false; say(e.message, true); });
          });
          el.append(email, meta, badge, btn);
          return el;
        }

        $('keyForm').addEventListener('submit', function (e) {
          e.preventDefault();
          var k = $('keyInput').value.trim();
          if (!k) return;
          setKey(k);
          $('keyInput').value = '';
          say('');
          showStep();
        });

        $('searchForm').addEventListener('submit', function (e) {
          e.preventDefault();
          var email = $('emailInput').value.trim();
          if (!email) return;
          var btn = e.submitter || $('searchForm').querySelector('button');
          btn.disabled = true;
          say('Aranıyor…');
          $('results').innerHTML = '';
          call('GET', '/admin/users?email=' + encodeURIComponent(email))
            .then(function (users) {
              render(users);
              say(users.length ? '' : 'Bu e-postayla kayıtlı hesap bulunamadı.');
            })
            .catch(function (e) { say(e.message, true); })
            .finally(function () { btn.disabled = false; });
        });

        $('forgetKey').addEventListener('click', function () {
          clearKey(); $('results').innerHTML = ''; $('orders').innerHTML = ''; say(''); showStep();
        });

        var PLAN = { weekly: 'Haftalık', monthly: 'Aylık', yearly: 'Yıllık' };
        var ORDER_STATUS = { pending: 'Bekliyor', processing: 'İşleniyor', paid: 'Ödendi', claimed: 'Ödendi', failed: 'Başarısız' };
        var SUB = {
          active: { text: 'Abonelik aktif', cls: 'is-on' },
          unclaimed: { text: 'Ödendi, uygulama hesabına bağlanmadı', cls: 'is-warn' },
          inactive: { text: 'Hesapta premium kapalı', cls: 'is-off' },
          expired: { text: 'Süresi doldu', cls: '' },
          unpaid: { text: 'Ödeme yok', cls: '' }
        };
        var SELLER = {
          name: 'Healife Sağlık Ürünleri Pazarlama Sanayi İç ve Dış Ticaret Ltd. Şti.',
          address: 'Atakent Mah. Haldun Taner Sk. No: 1 Ümraniye/İstanbul',
          tax: 'Alemdağ V.D. 4610896992',
          mersis: 'MERSİS 0461089699200001 · Sicil No 236743-5',
          contact: '+90 850 305 76 78 · info@hea-life.com · hea-life.com'
        };
        var lastGeneratedAt = null;

        function day(d) { return d ? new Date(d).toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' }) : '-'; }
        function stamp(d) { return d ? new Date(d).toLocaleString('tr-TR', { dateStyle: 'long', timeStyle: 'short' }) : '-'; }
        function money(kurus) { return (kurus / 100).toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' }); }
        function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

        function orderCard(o) {
          var el = document.createElement('div');
          el.className = 'adm__card';
          var head = document.createElement('div');
          head.className = 'adm__email';
          head.textContent = (o.name || 'İsimsiz') + ' · ' + o.email;
          var row1 = document.createElement('div');
          row1.className = 'adm__row';
          row1.innerHTML = '<span>Sipariş <strong>' + esc(o.merchantOid) + '</strong></span>' +
            '<span>' + esc(PLAN[o.planId] || o.planId) + ' · ' + esc(money(o.amountKurus)) + '</span>' +
            '<span>' + esc(ORDER_STATUS[o.status] || o.status) + (o.kind === 'renewal' ? ' (yenileme)' : '') + '</span>';
          var row2 = document.createElement('div');
          row2.className = 'adm__row';
          row2.textContent = 'Oluşturma: ' + day(o.createdAt) + ' · Ödeme: ' + day(o.paidAt) + ' · Dönem sonu: ' + day(o.periodEnd) +
            ' · Otomatik yenileme: ' + (o.autoRenew ? 'açık' : 'kapalı');
          var badge = document.createElement('span');
          var sub = SUB[o.subscription] || { text: o.subscription, cls: '' };
          badge.className = 'adm__badge ' + sub.cls;
          badge.textContent = sub.text;
          el.append(head, row1, row2, badge);
          if (o.status === 'failed' && o.failedReason) {
            var why = document.createElement('div');
            why.className = 'adm__meta';
            why.textContent = 'Sebep: ' + o.failedReason;
            el.append(why);
          }
          if (o.status === 'paid' || o.status === 'claimed') {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'adm__btn';
            btn.textContent = 'Abonelik belgesi (PDF)';
            btn.addEventListener('click', function () { openCertificate(o); });
            el.append(btn);
          }
          return el;
        }

        // Belge her açılışta canlı kayıttan üretilir; elle düzenlenecek bir alan yok.
        function openCertificate(o) {
          var w = window.open('', '_blank');
          if (!w) { say('Açılır pencere engellendi. Bu site için açılır pencerelere izin ver.', true); return; }
          var sub = SUB[o.subscription] || { text: o.subscription };
          var rows = [
            ['Sipariş numarası', o.merchantOid],
            ['Müşteri', o.name || '-'],
            ['E-posta', o.email],
            ['Telefon', o.phone || '-'],
            ['Ürün', 'Healife Premium · ' + (PLAN[o.planId] || o.planId) + ' abonelik'],
            ['Tutar', money(o.amountKurus) + ' (KDV dahil)'],
            ['Ödeme tarihi', stamp(o.paidAt)],
            ['Abonelik dönemi', day(o.periodStart) + ' – ' + day(o.periodEnd)],
            ['Otomatik yenileme', o.autoRenew ? 'Açık' : 'Kapalı'],
            ['Ödeme yöntemi', 'Kredi / banka kartı (PayTR)'],
            ['Bağlı uygulama hesabı', o.account ? (o.account.email || 'E-postasız hesap') : 'Henüz bağlanmadı'],
            ['Belge anındaki durum', sub.text]
          ];
          var body = rows.map(function (r) { return '<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>'; }).join('');
          w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Abonelik Durum Belgesi ' + esc(o.merchantOid) + '</title>' +
            '<style>body{font-family:Helvetica,Arial,sans-serif;color:#111;margin:0;padding:40px;max-width:720px}h1{font-size:20px;margin:24px 0 4px}' +
            '.seller{font-size:12px;line-height:1.6;color:#333}.meta{font-size:12px;color:#555;margin-bottom:20px}table{width:100%;border-collapse:collapse;font-size:13px}' +
            'th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #ddd;vertical-align:top}th{width:38%;color:#444;font-weight:600}' +
            '.note{margin-top:24px;font-size:11px;color:#555;line-height:1.5}.actions{margin-top:24px}button{padding:10px 18px;font-size:14px;cursor:pointer}' +
            '@media print{.actions{display:none}body{padding:0}}</style></head><body>' +
            '<div class="seller"><strong>' + esc(SELLER.name) + '</strong><br>' + esc(SELLER.address) + '<br>' + esc(SELLER.tax) + '<br>' + esc(SELLER.mersis) + '<br>' + esc(SELLER.contact) + '</div>' +
            '<h1>Abonelik Durum Belgesi</h1><div class="meta">Düzenlenme: ' + esc(stamp(lastGeneratedAt || new Date())) + '</div>' +
            '<table>' + body + '</table>' +
            '<p class="note">Bu belge Healife sistem kayıtlarından otomatik olarak oluşturulmuştur ve düzenlendiği andaki abonelik durumunu gösterir. Fatura yerine geçmez.</p>' +
            '<div class="actions"><button onclick="window.print()">PDF olarak kaydet / yazdır</button></div></body></html>');
          w.document.close();
        }

        function loadOrders(btn) {
          if (btn) btn.disabled = true;
          say('Yükleniyor…');
          $('orders').innerHTML = '';
          var q = '?status=' + encodeURIComponent($('ordersStatus').value);
          var email = $('ordersEmail').value.trim();
          if (email) q += '&email=' + encodeURIComponent(email);
          call('GET', '/admin/orders' + q)
            .then(function (data) {
              lastGeneratedAt = data.generatedAt;
              data.orders.forEach(function (o) { $('orders').appendChild(orderCard(o)); });
              say(data.orders.length ? data.orders.length + ' sipariş' : 'Sipariş bulunamadı.');
            })
            .catch(function (e) { say(e.message, true); })
            .finally(function () { if (btn) btn.disabled = false; });
        }

        function selectTab(tab) {
          activeTab = tab;
          [].forEach.call(document.querySelectorAll('.adm__tab'), function (b) { b.classList.toggle('is-active', b.getAttribute('data-tab') === tab); });
          say('');
          showStep();
          if (tab === 'orders' && getKey() && !$('orders').children.length) loadOrders();
        }
        [].forEach.call(document.querySelectorAll('.adm__tab'), function (b) {
          b.addEventListener('click', function () { selectTab(b.getAttribute('data-tab')); });
        });
        $('ordersForm').addEventListener('submit', function (e) {
          e.preventDefault();
          loadOrders(e.submitter || $('ordersForm').querySelector('button'));
        });


        showStep();
      })();
    </script>
  </body>
</html>
